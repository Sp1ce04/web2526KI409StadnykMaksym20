<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32 Control Panel</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; }
        .led-indicator { width: 50px; height: 50px; border-radius: 50%; margin: 20px auto; background: #444; border: 3px solid #666; }
        .led-on { background: #00ff00; box-shadow: 0 0 20px #00ff00; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Керування LED (ESP32)</h1>
    <div id="indicator" class="led-indicator"></div>
    <p>Статус: <span id="status-text">Завантаження...</span></p>
    <button onclick="sendControl('on')">ON</button>
    <button onclick="sendControl('off')">OFF</button>

    <script>
        async function updateUI() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const indicator = document.getElementById('indicator');
                const statusText = document.getElementById('status-text');
                
                if (data.led_on) {
                    indicator.classList.add('led-on');
                    statusText.innerText = "Увімкнено";
                } else {
                    indicator.classList.remove('led-on');
                    statusText.innerText = "Вимкнено";
                }
            } catch (e) { console.error("Помилка оновлення:", e); }
        }

        async function sendControl(cmd) {
            await fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
            updateUI();
        }

        // Polling: оновлення кожні 5 секунд
        setInterval(updateUI, 5000);
        updateUI(); // Перший запуск
    </script>
</body>
</html>
