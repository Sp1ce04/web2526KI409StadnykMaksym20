<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadnyk LABA4 | Wi-Fi Setup</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            font-family: 'Courier New', Courier, monospace;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Ефект сітки на фоні */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(30px); }
        }

        .card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            padding: 30px;
            border-radius: 0;
            width: 90%;
            max-width: 350px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 90% 100%, 0 100%);
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            margin-top: 0;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: var(--neon-blue);
            position: absolute;
            left: 0;
            top: 0;
            animation: scan 3s linear infinite;
            box-shadow: 0 0 10px var(--neon-blue);
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--neon-purple);
            color: var(--neon-blue);
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 5px var(--neon-blue);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        button:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .status {
            font-size: 0.7rem;
            margin-top: 15px;
            text-align: center;
            color: var(--neon-purple);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="scan-line"></div>
    <h2>System Access</h2>
    <div style="font-size: 0.7rem; color: var(--neon-blue); margin-bottom: 10px;">> Initialize WiFi sequence...</div>
    
    <form action="/save" method="POST">
        <input type="text" name="ssid" placeholder="ENTER SSID" required>
        <input type="password" name="pass" placeholder="ENTER ACCESS KEY">
        <button type="submit">Deploy Settings</button>
    </form>
    
    <div class="status">SIGNAL STRENGTH: OPTIMAL<br>SECURE CHANNEL ACTIVE</div>
</div>

</body>
</html>
