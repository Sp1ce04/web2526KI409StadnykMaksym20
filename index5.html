<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Secure Node</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --success: #22c55e;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .shield-icon {
            font-size: 50px;
            color: var(--accent);
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        h2 { margin: 0; font-weight: 600; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            font-weight: bold;
            font-size: 0.8rem;
            border: 1px solid var(--success);
            margin-bottom: 1.5rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-on { background: var(--success); color: white; }
        .btn-off { background: #ef4444; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Анімація пульсації */
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="shield-icon">🛡</div>
    <h2>Secure Admin Node</h2>
    <p>ESP32 WROVER Module</p>

    <div class="status-badge">
        <span class="pulse"></span> HTTPS / TLS 1.2 ACTIVE
    </div>

    <div class="control-panel">
        <button class="btn btn-on" onclick="sendCmd('on')">УВІМКНУТИ</button>
        <button class="btn btn-off" onclick="sendCmd('off')">ВИМКНУТИ</button>
    </div>

    <div class="footer">
        Encryption: AES-256-GCM<br>
        Node ID: KI-409-MIRON
    </div>
</div>

<script>
    async function sendCmd(state) {
        try {
            const response = await fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: state})
            });
            console.log('Command sent:', state);
        } catch (err) {
            console.error('Connection lost');
        }
    }
</script>

</body>
</html>
